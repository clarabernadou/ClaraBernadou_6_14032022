name: Deploy demo to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the static demo site (compiled front end + simulated API)
        run: |
          mkdir site
          cp Frontend/index.html Frontend/favicon.ico site/
          cp Frontend/*.js Frontend/*.css site/
          cp -r Frontend/assets site/assets
          cp demo/demo-api.js demo/sauces.json site/
          sed -i 's|<base href="/">|<base href="/ClaraBernadou_6_14032022/">|' site/index.html
          sed -i 's|</head>|<script src="demo-api.js"></script></head>|' site/index.html
          sed -i 's|\.\./\.\./assets/|assets/|g' site/main.*.js
          cp site/index.html site/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
